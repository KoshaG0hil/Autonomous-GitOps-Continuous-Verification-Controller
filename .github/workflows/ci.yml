name: Continuous Verification & Reconciler CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Run Pytest Suite & Canary Rollout Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests -v --cov=src --cov-report=term-missing

      - name: Validate Controller CLI Simulation
        run: |
          python cli.py status
          python cli.py verify --p95 50.0 --p99 120.0 --error-rate 0.1
          python cli.py simulate --mode healthy
          python cli.py simulate --mode degraded
