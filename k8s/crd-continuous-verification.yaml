apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: continuousverificationanalyses.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ContinuousVerificationAnalysis
    listKind: ContinuousVerificationAnalysisList
    plural: continuousverificationanalyses
    singular: continuousverificationanalysis
    shortNames:
      - cva
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targetDeployment
                - metrics
              properties:
                targetDeployment:
                  type: string
                trafficRouting:
                  type: object
                  properties:
                    meshType:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          setWeight:
                            type: integer
                          pauseDuration:
                            type: string
                metrics:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - query
                    properties:
                      name:
                        type: string
                      query:
                        type: string
                      failureLimit:
                        type: integer
                      successCondition:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                currentWeight:
                  type: integer
                rollbackTriggered:
                  type: boolean
                message:
                  type: string
